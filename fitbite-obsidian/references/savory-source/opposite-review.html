<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitbite — overkantcontrole</title><style>body{font:15px Arial;background:#132520;color:#f4f2eb;margin:24px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}img,video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#081410}button{padding:12px 18px;margin:10px 8px 10px 0;font:inherit;background:#0daf5b;border:0;border-radius:8px;color:#fff}p{line-height:1.5}@media(max-width:640px){main{grid-template-columns:1fr}}</style><h1>Controle: gevraagd overkantshot, resultaat opnieuw voorkant</h1><p>Controleer opstelling, voedselvormen, belichting en camerahoek. De rechteropname haalt de gevraagde overkant niet en blijft aan de voorkant.</p><main><section><h2>Oorspronkelijke foto — voorkant</h2><img src="../../assets/savory-hero.png"></section><section><h2>Nieuw gegenereerd shot — 720p</h2><video id="video" src="../../assets/savory-hero-opposite.mp4" controls muted playsinline preload="auto"></video></section></main><button data-seek="0.05">Begin</button><button data-seek="2">Midden</button><button data-seek="3.8">Einde</button><button id="play">Speel nieuw shot af</button><output id="time"></output><script>const v=document.querySelector('video');document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{v.pause();v.currentTime=Number(b.dataset.seek)});document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};v.onseeked=()=>document.querySelector('#time').textContent='Frame: '+v.currentTime.toFixed(2)+' s';</script></html>
