<!doctype html><html lang="nl"><meta charset="utf-8"><title>Fitbite — videoproef beoordelen</title><style>body{font:15px Arial;background:#132520;color:white;margin:24px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}img,video{width:100%;aspect-ratio:16/9;object-fit:cover;background:black}button{padding:12px 18px;margin:10px 8px 10px 0;font:inherit}p{line-height:1.5}</style><h1>Origineel en videoproef</h1><p>Links de originele voorpaginafoto. Rechts de ene gegenereerde proef.</p><main><section><h2>Origineel</h2><img src="../../assets/savory-hero.png"></section><section><h2>Video</h2><video id="video" src="../../assets/savory-hero-motion.mp4" controls muted playsinline preload="auto"></video></section></main><button data-seek="0.03">Begin</button><button data-seek="2.5">Midden</button><button data-seek="4.9">Einde</button><button id="play">Speel proef af</button><output id="time"></output><script>const v=document.querySelector("video");document.querySelectorAll("[data-seek]").forEach(b=>b.onclick=()=>{v.pause();v.currentTime=Number(b.dataset.seek)});document.querySelector("#play").onclick=()=>{v.currentTime=0;v.play()};v.onseeked=()=>document.querySelector("#time").textContent="Frame: "+v.currentTime.toFixed(2)+" s";</script></html>
